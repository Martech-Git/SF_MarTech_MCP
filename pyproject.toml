[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-mcp"
version = "0.2.0"
description = "Governed MCP server for Salesforce Marketing Cloud Engagement and Data 360"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.3,<3",
    "starlette>=1.9,<2",
    "uvicorn>=0.54,<1",
    "pydantic[email]>=2.14,<3",
    "pyyaml>=6.0,<7",
    "google-cloud-firestore>=2.34,<3",
    "google-auth>=2.62,<3",
    "requests>=2.34,<3",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-gcp-trace>=1.15,<2",
    "opentelemetry-instrumentation-asgi>=0.66b1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<1",
    "mypy>=2.4,<3",
    "ruff>=0.17,<1",
    "types-PyYAML",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sf_mcp.tools" = ["*/description.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/sf_mcp/tools"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"
exclude = ["src/sf_mcp/tools/.*/test_.*\\.py$"]
disallow_any_explicit = false
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["opentelemetry.exporter.cloud_trace.*", "google.cloud.firestore.*", "google.cloud.firestore_v1.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501"]
"src/sf_mcp/tools/*/test_*.py" = ["S105", "S106"]
